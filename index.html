<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A classic Snake game built with HTML, CSS, and JavaScript."
    />
    <title>Snake Game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="game">
      <div class="scoreboard" aria-label="Current score">
        <img src="./img/food.png" alt="" />
        <span aria-live="polite">0</span>
      </div>

      <canvas
        id="snake"
        width="608"
        height="608"
        aria-label="Snake game board. Use the arrow keys to move."
      >
        Your browser does not support the HTML canvas element.
      </canvas>

      <section class="reloader" role="dialog" aria-labelledby="game-over-title" aria-modal="true">
        <h2 id="game-over-title">GAME OVER</h2>
        <p class="highScore"></p>
        <button class="reloading" type="button">PLAY AGAIN</button>
      </section>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
